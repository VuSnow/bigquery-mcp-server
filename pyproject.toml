[project]
name = "bigquery-mcp-server"
version = "0.1.0"
description = "A FastMCP Server for BigQuery interaction — dataset discovery, schema inspection, metadata, dry-run validation, and query execution tools for Text2SQL agents."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "google-cloud-bigquery>=3.25.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
