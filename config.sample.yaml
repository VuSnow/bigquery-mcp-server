# BigQuery MCP Server — YAML Configuration
# This file contains GUARDRAILS ONLY — no domain knowledge.
# Table descriptions, join rules, and examples belong in the Text2SQL agent layer.

settings:
  table_access_mode: "hybrid"  # yaml_only | auto_discovery | hybrid

guardrails:
  max_rows: 1000
  default_limit: 100
  max_bytes_billed: 10737418240  # 10 GiB

pii_masking:
  - name: "email"
    method: "hash"
  - name: "phone_number"
    method: "redact"
  - name: "full_name"
    method: "redact"

# Per-table constraints (guardrails only)
tables:
  - name: "analytics.fact_orders"
    constraints:
      required_filters: ["order_date"]
      max_days_back: 365
      disallowed_patterns: ["SELECT *"]
    allowed_operations: ["SELECT", "COUNT", "SUM", "AVG", "GROUP BY", "ORDER BY"]

  - name: "analytics.dim_customers"
    constraints:
      disallowed_patterns: ["SELECT *", "LIKE '%@%'"]
    allowed_operations: ["SELECT", "COUNT", "GROUP BY", "ORDER BY"]

# Explicit deny list (overrides everything, supports glob patterns)
blocked_tables:
  - "internal.pii_raw_data"
  - "internal.audit_logs"
  - "temp.*"
