[project]
name = "bigquery-mcp-server"
version = "0.1.0"
description = "A FastMCP Server for BigQuery interaction — dataset discovery, schema inspection, metadata, dry-run validation, and query execution tools for Text2SQL agents."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10.1",
    "google-cloud-bigquery>=3.40.1",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
