# BigQuery MCP Server — Single YAML Configuration
# All settings, connections, guardrails, and table constraints live here.
# Only env var needed: CONFIG_FILE_PATH (defaults to config.yaml)

mcp:
  name: bigquery-mcp
  version: 0.3.0

bq:
  # Multi-connection support: define named connections, set a default.
  default_connection: prod-us
  connections:
    prod-us:
      project: your-prod-project
      default_region: US
      key_file: /secrets/prod-us-sa.json
      datasets:                       # optional dataset filter
        - analytics
        - sales

    staging-eu:
      project: your-staging-project
      default_region: europe-west4
      key_file: /secrets/staging-eu-sa.json
      datasets:
        - staging_analytics
      max_bytes_billed: 5368709120    # per-connection override (5 GiB)

guardrails:
  read_only: true
  default_limit: 100
  max_limit: 1000
  max_bytes_billed: 10737418240      # 10 GiB global default
  max_query_length: 10000
  query_timeout_seconds: 300         # max execution time per query (seconds)
  forbid_cross_connection: true      # block queries spanning multiple connections
  rate_limit:
    max_calls: 100
    window_seconds: 3600

pii:
  - column: email
    method: hash
  - column: phone_number
    method: redact
  - column: ssn
    method: redact

# Per-table constraints (guardrails overlay)
tables:
  - name: analytics.fact_orders
    connection: prod-us
    constraints:
      required_filters: [order_date]
      max_days_back: 365
      disallowed_patterns: ["SELECT *"]
    allowed_operations: [SELECT, COUNT, SUM, AVG, GROUP BY, ORDER BY]

  - name: analytics.dim_customers
    connection: prod-us
    constraints:
      disallowed_patterns: ["SELECT *", "LIKE '%@%'"]
    allowed_operations: [SELECT, COUNT, GROUP BY, ORDER BY]

  - name: staging_analytics.experiment_results
    connection: staging-eu
    constraints:
      max_days_back: 30

# Explicit deny list (supports glob patterns)
blocked_tables:
  - "internal.*"
  - "temp.*"
  - "*.pii_raw_*"
